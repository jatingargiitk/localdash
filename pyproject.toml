[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localdash"
version = "0.1.0"
description = "Turn any CSV or database into a live dashboard. Local, free, any model. Every chart shows its SQL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "localdash contributors" }]
keywords = ["dashboard", "duckdb", "sql", "llm", "analytics", "csv", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "duckdb>=1.1",
  "typer>=0.12",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
localdash = "localdash.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["localdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
