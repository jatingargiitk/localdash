[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localdash"
version = "0.1.0"
description = "Turn any CSV or database into a live dashboard. Local, free, any model. Every chart shows its SQL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jatin Garg" }]
keywords = ["dashboard", "duckdb", "csv", "sql", "llm", "ollama", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "duckdb>=1.1",
  "typer>=0.12",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/jatingargiitk/localdash"
Repository = "https://github.com/jatingargiitk/localdash"
Issues = "https://github.com/jatingargiitk/localdash/issues"

[project.scripts]
localdash = "localdash.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["localdash"]

[tool.hatch.build.targets.wheel.force-include]
"localdash/templates" = "localdash/templates"
"localdash/vendor" = "localdash/vendor"

[tool.pytest.ini_options]
testpaths = ["tests"]
